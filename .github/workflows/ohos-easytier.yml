name: FlClash with EasyTier (OHOS)

on:
  push:
    branches: [feature/easytier-integration, feature/easytier-ui-v0.9.2-ohos]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ohos-easytier-${{ github.ref }}
  cancel-in-progress: true

env:
  EASYTIER_REF: 0d670abd638bda608e1471ddd11448ee4751a033
  FLUTTER_TAG: 3.47.7+ohos-0.0.1-pre
  FLUTTER_REF: 650641656fef1d0578f0bc1ed8f7a35087fc99f3

defaults:
  run:
    shell: bash

jobs:
  easytier-har:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          repository: libo0118/EasyTier
          ref: ${{ env.EASYTIER_REF }}
          fetch-depth: 0
      # Reuse the tested pinned core; rebuild if the artifact expires or the core changes.
      - name: Retrieve the validated native library
        id: previous-har
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: easytier-embedded-har
          run-id: 38710489961
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: easytier-contrib/easytier-ohrs
      - name: Verify the reused library revision
        id: native-cache
        run: |
          package_dir=easytier-contrib/easytier-ohrs
          if [ -s "$package_dir/easytier-ohrs.har" ] && [ "$(cat "$package_dir/easytier-commit.txt" 2>/dev/null)" = "$EASYTIER_REF" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/prepare-build
        if: steps.native-cache.outputs.hit != 'true'
        with:
          target: aarch64-unknown-linux-ohos
          gui: 'false'
          pnpm: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        if: steps.native-cache.outputs.hit != 'true'
        with:
          shared-key: flclash-ohos
      - uses: ErBWs/setup-ohos@v1
        if: steps.native-cache.outputs.hit != 'true'
      - name: Prepare OHOS tools
        if: steps.native-cache.outputs.hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -qqy pkg-config curl libgl1-mesa-dev expect llvm clang lldb lld
          rustup component add rustfmt
          sudo mkdir -p "$OHOS_NDK_HOME/native/llvm"
          sudo tee "$OHOS_NDK_HOME/native/llvm/aarch64-unknown-linux-ohos-clang.sh" >/dev/null <<'EOF'
          #!/bin/sh
          exec "$OHOS_NDK_HOME/native/llvm/bin/clang" \
            -target aarch64-linux-ohos \
            --sysroot="$OHOS_NDK_HOME/native/sysroot" \
            -D__MUSL__ "$@"
          EOF
          sudo chmod +x "$OHOS_NDK_HOME/native/llvm/aarch64-unknown-linux-ohos-clang.sh"
      - name: Format Rust sources
        if: steps.native-cache.outputs.hit != 'true'
        run: |
          cargo fmt --all
          cargo fmt --all --manifest-path easytier-contrib/easytier-ohrs/Cargo.toml
      - name: Test SOCKS5 protocol and overlay UDP
        if: steps.native-cache.outputs.hit != 'true'
        run: |
          cargo test --locked -p easytier-core --features proxy-smoltcp-stack --lib gateway::socks5 -- --test-threads=1
          cargo test --locked -p easytier-core --features proxy-smoltcp-stack --lib socks5_udp_associate_crosses_overlay_and_releases_resources -- --test-threads=1
      - name: Test OHOS bridge
        if: steps.native-cache.outputs.hit != 'true'
        run: |
          cargo test --locked --manifest-path easytier-contrib/easytier-ohrs/Cargo.toml -p easytier-ohos-core -p easytier-ohos-features --lib -- --test-threads=1
          cargo check --locked --manifest-path easytier-contrib/easytier-ohrs/Cargo.toml -p easytier-ohrs --tests
      - name: Check OHOS target
        if: steps.native-cache.outputs.hit != 'true'
        working-directory: easytier-contrib/easytier-ohrs
        run: |
          source env.sh
          cargo check --locked -p easytier-ohrs --tests --target aarch64-unknown-linux-ohos
      - uses: taiki-e/install-action@v2
        if: steps.native-cache.outputs.hit != 'true'
        with:
          tool: ohrs
      - name: Build embedded HAR
        if: steps.native-cache.outputs.hit != 'true'
        working-directory: easytier-contrib/easytier-ohrs
        run: |
          source env.sh
          ohrs build --release --arch aarch
          ohrs artifact
          mv package.har easytier-ohrs.har
          test -s easytier-ohrs.har
          printf '%s\n' "$EASYTIER_REF" > easytier-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: easytier-embedded-har
          path: |
            easytier-contrib/easytier-ohrs/easytier-ohrs.har
            easytier-contrib/easytier-ohrs/easytier-commit.txt
          if-no-files-found: error
          retention-days: 14
      - name: Save formatting patch
        if: always()
        run: git diff --binary > "$RUNNER_TEMP/easytier-format.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easytier-format-patch
          path: ${{ runner.temp }}/easytier-format.patch
          if-no-files-found: warn
          retention-days: 7

  app-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test OHOS startup error reporting
        run: node ohos/tests/startup_diagnostics.test.cjs
      - name: Test HarmonyOS VPN card commands and state
        run: node ohos/tests/vpn_card.test.cjs
      - name: Test OHOS core build contract
        run: node --test plugins/setup/buildkit/build_ohos.test.cjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: core/go.sum
      - name: Prepare the pinned Mihomo OHOS DNS support
        run: |
          test "$(git -C core/Clash.Meta rev-parse HEAD)" = c5062921054902b25215a6a933e72ccd714c9bfa
          patch="$PWD/.github/mihomo-ohos.patch"
          git -C core/Clash.Meta apply --check "$patch"
          git -C core/Clash.Meta apply "$patch"
      - name: Test the Go core
        working-directory: core
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: go test -count=1 -mod=readonly .
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
      - uses: ErBWs/setup-ohos@v2.0.0
        with:
          version: 26.0.0.821
          cache: true
      - name: Setup Flutter for OpenHarmony
        run: |
          git clone -b "$FLUTTER_TAG" --depth 1 https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TOOL_CACHE/flutter-ohos"
          test "$(git -C "$RUNNER_TOOL_CACHE/flutter-ohos" rev-parse HEAD)" = "$FLUTTER_REF"
          git -C "$RUNNER_TOOL_CACHE/flutter-ohos" tag 3.47.7
          echo "$RUNNER_TOOL_CACHE/flutter-ohos/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TOOL_CACHE/flutter-ohos/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$HOME/.pub-cache" >> "$GITHUB_ENV"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Patch UI dependencies for OpenHarmony
        run: node .github/patch-ui-ohos.cjs
      - name: Test OpenHarmony UI dependency patches
        run: node --test .github/patch-ui-ohos.test.cjs
      - name: Skip the desktop Go hook during Flutter tests
        run: yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml
      - name: Generate models, providers and translations
        run: |
          dart run intl_utils:generate
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test plugins setup.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Prepare Chinese font for dashboard renders
        run: sudo apt-get install -qqy fonts-noto-cjk
      - name: Test
        env:
          EASYTIER_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          EASYTIER_TEST_ICON_FONT: ${{ runner.tool_cache }}/flutter-ohos/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf
          EASYTIER_VISUAL_DIR: ${{ runner.temp }}/easytier-dashboard-renders
        run: |
          flutter test --reporter expanded
          flutter test plugins/rust_api/test/ohos_build_test.dart --reporter expanded
      - name: Upload dashboard renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytier-dashboard-renders
          path: ${{ runner.temp }}/easytier-dashboard-renders
          if-no-files-found: error
          retention-days: 14
      - name: Save generated source changes
        if: always()
        run: |
          cp pubspec.lock "$RUNNER_TEMP/pubspec.lock"
          git diff --binary -- lib test arb > "$RUNNER_TEMP/flclash-generated.patch"
          find lib -type f \( -name '*.g.dart' -o -name '*.freezed.dart' -o -path 'lib/l10n/*.dart' \) -print0 | tar --null -czf "$RUNNER_TEMP/generated-sources.tar.gz" -T -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flclash-checked-sources
          path: |
            ${{ runner.temp }}/flclash-generated.patch
            ${{ runner.temp }}/generated-sources.tar.gz
            ${{ runner.temp }}/pubspec.lock
          if-no-files-found: warn
          retention-days: 7

  app:
    needs: [easytier-har, app-check]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Use HTTPS for the public core submodule
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: easytier-embedded-har
          path: ohos/entry/libs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ErBWs/setup-ohos@v2.0.0
        with:
          version: 26.0.0.821
          cache: true
      - name: Setup Flutter for OpenHarmony
        run: |
          git clone -b "$FLUTTER_TAG" --depth 1 https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TOOL_CACHE/flutter-ohos"
          test "$(git -C "$RUNNER_TOOL_CACHE/flutter-ohos" rev-parse HEAD)" = "$FLUTTER_REF"
          git -C "$RUNNER_TOOL_CACHE/flutter-ohos" tag 3.47.7
          echo "$RUNNER_TOOL_CACHE/flutter-ohos/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TOOL_CACHE/flutter-ohos/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$HOME/.pub-cache" >> "$GITHUB_ENV"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: flclash-checked-sources
          path: ${{ runner.temp }}/checked-sources
      - name: Restore the tested generated sources
        run: |
          cp "$RUNNER_TEMP/checked-sources/pubspec.lock" pubspec.lock
          if [ -s "$RUNNER_TEMP/checked-sources/flclash-generated.patch" ]; then
            git apply "$RUNNER_TEMP/checked-sources/flclash-generated.patch"
          fi
          tar -xzf "$RUNNER_TEMP/checked-sources/generated-sources.tar.gz"
      - name: Resolve the tested Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Patch UI dependencies for OpenHarmony
        run: node .github/patch-ui-ohos.cjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: core/go.sum
      - uses: actions/cache@v4
        id: ohos-go
        with:
          path: ${{ runner.tool_cache }}/ohos-go-1.27.3
          key: ${{ runner.os }}-ohos-go-1.27.3-${{ hashFiles('.github/ohos-go1.27.patch') }}
      - name: Setup OpenHarmony Go
        run: |
          bash .github/setup-ohos-go.sh "$RUNNER_TOOL_CACHE/ohos-go-1.27.3"
      - name: Compile the OHOS C shared core
        run: node plugins/setup/buildkit/build_ohos.cjs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
      - name: Prepare the Rust OHOS target
        run: |
          sudo apt-get install -qqy libclang-dev llvm-dev
          export LIBCLANG_PATH="$(llvm-config --libdir)"
          python3 -c 'import ctypes, os; ctypes.CDLL(os.path.join(os.environ["LIBCLANG_PATH"], "libclang.so"))'
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-unknown-linux-ohos
      - name: Build one unsigned HarmonyOS app
        env:
          FLCLASH_OHOS_BUILD: '1'
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml
          dart setup.dart ohos -v
          test -n "$(find dist -type f \( -name '*.hap' -o -name '*.app' \) -print -quit)"
          printf 'FlClash: %s\nEasyTier: %s\nSigning: unsigned\n' "$GITHUB_SHA" "$EASYTIER_REF" > dist/build-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-EasyTier-OHOS-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Save generated source changes
        if: always()
        run: |
          git diff --binary -- lib test arb ohos/oh-package-lock.json5 > "$RUNNER_TEMP/flclash-generated.patch"
          find lib -type f \( -name '*.g.dart' -o -name '*.freezed.dart' -o -path 'lib/l10n/*.dart' \) -print0 | tar --null -czf "$RUNNER_TEMP/generated-sources.tar.gz" -T -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flclash-generated-sources
          path: |
            ${{ runner.temp }}/flclash-generated.patch
            ${{ runner.temp }}/generated-sources.tar.gz
          if-no-files-found: warn
          retention-days: 7
